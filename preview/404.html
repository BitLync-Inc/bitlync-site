<script>
(function(){
  var raw=location.pathname||'/';
  var preview=raw.indexOf('/preview')===0;
  var p=raw;

  p=p.replace(/\/$/,'');

    '/docs':'docs',

    location.replace(root);
  }
})();
</script>
